name: Update cask

# Receives the repository_dispatch sent by each app's release workflow.
on:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Update cask
        env:
          # PortMonitor's workflow predates the "cask" field.
          CASK: ${{ github.event.client_payload.cask || 'portmonitor' }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
          URL: ${{ github.event.client_payload.url }}
        run: |
          test -f "Casks/${CASK}.rb"
          python3 .github/scripts/update_cask.py "Casks/${CASK}.rb" "$VERSION" "$SHA256" "$URL"

      - name: Commit
        env:
          CASK: ${{ github.event.client_payload.cask || 'portmonitor' }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git diff --cached --quiet && exit 0
          git commit -m "${CASK} ${VERSION}"
          git push
